<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heads or Tails? - URK24CS1146</title>
</head>
<body>

    <h2>Heads or Tails? - URK24CS1146</h2>
    <br>
    <img src="coins.jpg" id="coin" width="250"><br><br>
    
    <button id="flip">Flip!</button>
    <br><br>
    
    <p>
        Heads Total: <span id="num_heads">0</span><br>
        Tails Total: <span id="num_tails">0</span>
    </p>

    <script>
        let heads = 0;
        let tails = 0;

        document.getElementById("flip").addEventListener("click", flipFunction);

        function flipFunction() {
            let random = Math.floor(Math.random() * 2);
            
            if (random === 0) {
                document.getElementById("coin").src = "heads.jpg";
                heads++;
            } else {
                document.getElementById("coin").src = "tails.jpg";
                tails++;
            }

            document.getElementById("num_heads").innerHTML = heads;
            document.getElementById("num_tails").innerHTML = tails;
        }
    </script>

</body>
</html>
