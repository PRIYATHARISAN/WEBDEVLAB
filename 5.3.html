<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency Converter - URK24CS1146</title>
</head>
<body>

    <h2>Currency Converter - URK24CS1146</h2>
    
    <input type="text" id="data" placeholder="Enter amount"><br><br>
    
    <select id="from">
        <option>Indian Rupee</option>
        <option>US Dollar</option>
    </select>
    to
    <select id="to">
        <option>US Dollar</option>
        <option>Indian Rupee</option>
    </select>
    
    <button onclick="convert()">Calculate</button>
    
    <p>Answer: <span id="answer"></span></p>

    <script>
        function convert() {
            let value = parseFloat(document.getElementById("data").value);
            let from = document.getElementById("from").value;
            let to = document.getElementById("to").value;
            let result;

            // Check if input is a valid number
            if (isNaN(value)) {
                document.getElementById("answer").innerHTML = "Please enter a valid number";
                return;
            }

            if (from == "Indian Rupee" && to == "US Dollar") {
                result = value * 0.015;
            } else if (from == "US Dollar" && to == "Indian Rupee") {
                result = value * 67.12;
            } else {
                result = value; // Same currency selected
            }

            document.getElementById("answer").innerHTML = result.toFixed(2);
        }
    </script>

</body>
</html>
