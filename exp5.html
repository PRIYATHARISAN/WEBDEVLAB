<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shortest and Longest word - URK24CS1146</title>
</head>
<body>

    <h2>Find Shortest and Longest word - URK24CS1146</h2>
    <button onclick="findwords()">Find</button>
    <p id="result"></p>

    <script>
        function findwords() {
            var str = "Web Development Tutorial";
            var words = str.split(" ");
            
            var shortest = words[0];
            var longest = words[0];

            for (var i = 1; i < words.length; i++) {
                if (words[i].length < shortest.length) {
                    shortest = words[i];
                }
                if (words[i].length > longest.length) {
                    longest = words[i];
                }
            }

            document.getElementById("result").innerHTML = 
                "Shortest: " + shortest + "<br>" + 
                "Longest: " + longest;
        }
    </script>

</body>
</html>
