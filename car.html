<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Background Colour - URK24CS1125</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        p {
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <h1>Dynamic Background Colour - URK24CS1125</h1>
    <p>The background colour changes every 5 seconds.</p>

    <script>
    function changeColor() {
        var red = Math.floor(Math.random() * 256);
        var green = Math.floor(Math.random() * 256);
        var blue = Math.floor(Math.random() * 256);
        var color = "rgb(" + red + "," + green + "," + blue + ")";
        document.body.style.backgroundColor = color;
    }
    
    changeColor();
    setInterval(changeColor, 5000);
    </script>

</body>
</html>
