<h1>Change font size!</h1>

<p id="paral" onmouseover="incSize()" onmouseout="decSize()">
    Move cursor over me to zoom in...
</p>

<script>
// Define function incSize
function incSize() {
    // Select the paragraph by its ID and increase font size to 28px
    document.getElementById("paral").style.fontSize = "28px";
}

// Define function decSize
function decSize() {
    // Select the paragraph by its ID and restore it to its original size (e.g., 16px)
    document.getElementById("paral").style.fontSize = "16px";
}
</script>
</body>
